name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux and Windows, AArch64 macOS (NEON paths).
        # `require_isa` makes the muninn-simd tests fail if that SIMD path
        # is unavailable, so a job can never pass by testing scalar only.
        include:
          - os: ubuntu-latest
            require_isa: avx2
          - os: windows-latest
            require_isa: avx2
          - os: macos-latest
            require_isa: neon
    runs-on: ${{ matrix.os }}
    env:
      MUNINN_TEST_REQUIRE_ISA: ${{ matrix.require_isa }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
