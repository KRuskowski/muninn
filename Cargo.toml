[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/KRuskowski/muninn"
license = "MIT"

[workspace.dependencies]
muninn-core = { path = "crates/muninn-core" }
muninn-simd = { path = "crates/muninn-simd" }
muninn-vector = { path = "crates/muninn-vector" }
muninn-text = { path = "crates/muninn-text" }
muninn-store = { path = "crates/muninn-store" }
muninn-filter = { path = "crates/muninn-filter" }
muninn = { path = "crates/muninn" }
muninn-server = { path = "crates/muninn-server" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Keeps target/ small: full debuginfo for every dependency costs gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
debug = "line-tables-only"
