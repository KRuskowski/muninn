[package]
name = "muninn-store"
description = "Durable storage for muninn: WAL, memory-mapped segments, payloads."
version.workspace = true
edition.workspace = true
# std File::try_lock (DirLock) needs 1.89.
rust-version = "1.89"
repository.workspace = true
license.workspace = true

[dependencies]
muninn-core.workspace = true
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "idmap"
harness = false

[lints]
workspace = true
