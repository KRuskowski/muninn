[package]
name = "muninn-store"
description = "Durable storage for muninn: WAL, memory-mapped segments, payloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
muninn-core.workspace = true
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "idmap"
harness = false

[lints]
workspace = true
