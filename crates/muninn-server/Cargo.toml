[package]
name = "muninn-server"
description = "HTTP/JSON server and command-line tool for the muninn database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "muninn_server"

[[bin]]
name = "muninn"
path = "src/main.rs"
# The library crate `muninn` documents to the same directory.
doc = false

[dependencies]
muninn.workspace = true
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
# Streams the NDJSON bulk body frame by frame (already used by axum).
http-body-util = "0.1"
# Parses import batches on all cores (already used by the engine).
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tracing = { version = "0.1.40", default-features = false, features = [
  "std",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
] }

[dev-dependencies]
# HTTP/1.1 keep-alive client for the load generator (both crates are
# already in the build through axum; only client features are added).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
