[package]
name = "muninn"
description = "Embedded vector database and full-text search engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
muninn-core.workspace = true
muninn-simd.workspace = true
muninn-vector.workspace = true
muninn-text.workspace = true
muninn-store.workspace = true
# Parallel fan-out of one search over segments (already used by
# muninn-vector, so no new dependency in the build).
rayon = "1.10"
# Document payloads are arbitrary JSON (already used by muninn-store).
serde_json = "1"

[lints]
workspace = true
