license.workspace = true

[dependencies]
muninn-core.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "kernels"
harness = false

[lints]
workspace = true
